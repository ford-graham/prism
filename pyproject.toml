[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.0"
description = "A framework for computing and commanding orbital sunlight-reflector ('space mirror') satellites."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "prism contributors" }]
keywords = ["satellite", "orbital-mechanics", "sgp4", "space-mirror", "reflector", "sunlight"]
dependencies = [
    "sgp4>=2.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://example.org/prism"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
